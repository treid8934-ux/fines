<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richmond Royal's Fines Ladder</title>
<meta name="theme-color" content="#123B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    /* Club rooms palette */
    --green-d: #123B2C; --board: #0B1F17; --board-line: #2A5A45; --board-text: #F7E7B8; --board-dim: #8FB8A3;
    --bg: #F3EBDB; --card: #FFFBF2; --ink: #14261E; --muted: #55625A; --line: #DCCFB5;
    --yellow: #F2B33D; --red: #B83A28; --green: #1E7046;
    --display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Share Tech Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
  body.wide .wrap, .wide-wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

  header { background: var(--green-d); color: var(--bg); border-bottom: 2px solid rgba(243,235,219,.12); }
  header .wrap { padding: 16px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; flex: 1; min-width: 0; }
  .logo { width: 44px; height: 44px; flex: none; }
  .brandname { font-family: var(--display); font-weight: 900; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--yellow); line-height: 1; }
  h1 { font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; margin: 2px 0 0; line-height: 1; overflow-wrap: anywhere; }
  .stripes { height: 10px; background: repeating-linear-gradient(90deg, var(--red) 0 80px, var(--yellow) 80px 160px, var(--bg) 160px 240px); }
  .banner { background: var(--red); color: #fff; padding: 10px 16px; font-weight: 600; text-align: center; }
  a { color: inherit; }
  .who { font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .who b { color: var(--yellow); }
  header button.ghost { color: var(--bg); }

  h2 { font-family: var(--display); font-weight: 900; font-size: 30px; text-transform: uppercase; letter-spacing: .02em; margin: 36px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; color: var(--green-d); line-height: 1; }
  h2 small { font-family: var(--body); font-weight: 500; font-size: 14px; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .panel { background: var(--card); border: 2px solid var(--line); border-radius: 10px; }
  .pad { padding: 18px; }
  .empty { color: var(--muted); padding: 18px; font-size: 15px; }

  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 11px 16px; font-weight: 700; background: var(--green-d); color: var(--bg); min-height: 44px; }
  button:hover { background: #1A4D3A; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: inherit; border: 2px solid currentColor; padding: 7px 12px; font-size: 14px; }
  button.ghost:hover { background: rgba(20,38,30,.06); }
  button.yes { background: var(--green); color: #fff; } button.no { background: var(--red); color: #fff; }
  button.danger { background: transparent; color: var(--red); border: 2px solid var(--red); padding: 7px 12px; font-size: 13px; }
  button.amber, .btn-amber { background: var(--yellow); color: var(--green-d); }
  button.amber:hover { background: #F5C15E; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  select, input, textarea { width: 100%; padding: 11px; border: 2px solid var(--line); border-radius: 8px; background: #fff; min-height: 44px; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { margin-bottom: 12px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sub { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: .04em; font-size: 22px; margin: 26px 0 8px; color: var(--green-d); }
  .mvp { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
  .mvp b { font-family: var(--mono); font-size: 20px; }
  .prow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .prow input { flex: 1; min-width: 130px; }
  .prow button { white-space: nowrap; }
  .ticks { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px 12px; }
  .tick { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--ink); font-weight: 500; margin: 0; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .tick input { width: auto; margin: 0; min-height: 0; }
  .payrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 18px; border-bottom: 1px dashed var(--line); }
  .owe { color: var(--red); } .paidup { color: var(--green); }
  .split { display: flex; justify-content: space-between; gap: 12px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; border: 2px solid currentColor; margin-left: 8px; vertical-align: 2px; text-transform: uppercase; letter-spacing: .04em; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .stat { background: var(--bg); border: 2px dashed var(--line); border-radius: 6px; padding: 8px 10px; }
  .stat b { display: block; font-family: var(--mono); font-size: 22px; line-height: 1.15; }
  .stat span { font-size: 12px; color: var(--muted); }
  #app.is-pending > section:not(#pendingSec) { display: none !important; }
  .price { font-family: var(--mono); font-size: 26px; margin: 4px 0 14px; color: var(--green-d); }
  .price s { color: var(--muted); margin-right: 8px; }
  .navlink { color: var(--bg); text-decoration: none; font-weight: 600; padding: 8px 6px; }
  .ghostlink { color: var(--bg); text-decoration: none; border: 2px solid var(--bg); border-radius: 8px; padding: 8px 14px; font-weight: 700; }
  .cta { background: var(--yellow); color: var(--green-d); text-decoration: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; display: inline-block; }
  .cta:hover { background: #F5C15E; }
  .rnd { padding: 12px 0; border-bottom: 1px dashed var(--line); }

  /* Ladder: the scoreboard */
  #ladder { background: var(--board); border: 6px solid var(--board-line); border-radius: 12px; color: var(--board-text); overflow: hidden; }
  #ladder .empty { color: var(--board-dim); }
  .pot { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; border-bottom: 2px dashed var(--board-line); }
  .pot span { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .pot strong { font-family: var(--mono); font-weight: 400; font-size: 32px; line-height: 1; }
  #ladder .pot span { color: var(--board-dim); }
  #ladder .pot strong { color: var(--yellow); }
  .rung { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 11px 18px; border-bottom: 1px solid #1D3F31; position: relative; }
  .rung:last-child { border-bottom: 0; }
  .rung .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--yellow); opacity: .10; pointer-events: none; }
  .rung > * { position: relative; }
  .pos { font-family: var(--mono); font-size: 22px; color: var(--yellow); text-align: center; }
  .rung.top .pos { background: var(--yellow); color: var(--board); border-radius: 4px; }
  .pname { font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .03em; }
  .pmeta { font-size: 13px; color: var(--muted); }
  #ladder .pmeta { color: var(--board-dim); }
  .ptotal { font-family: var(--mono); font-size: 24px; font-variant-numeric: tabular-nums; }
  .rung.zero .ptotal { color: var(--board-dim); }
  #payments .ptotal { font-size: 20px; }

  /* Fine cards */
  .fine { padding: 16px 18px; border-bottom: 1px dashed var(--line); }
  .fine:last-child { border-bottom: 0; }
  .fhead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .fhead .t { font-weight: 700; font-size: 19px; }
  .fhead .a { font-family: var(--display); font-weight: 900; font-size: 32px; white-space: nowrap; color: var(--green-d); }
  .reason { margin: 4px 0 8px; overflow-wrap: anywhere; font-size: 17px; }
  .meta { font-size: 13px; color: var(--muted); }
  .tally { display: flex; gap: 14px; margin: 10px 0 6px; font-size: 14px; font-weight: 700; flex-wrap: wrap; }
  .pips { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 6px; }
  .pip { width: 14px; height: 14px; border-radius: 3px; border: 2px solid currentColor; }
  .pip.on { background: currentColor; }
  .c-yes { color: var(--green); } .c-no { color: var(--red); }
  .voters { font-size: 13px; color: var(--muted); }
  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .actions button.yes, .actions button.no { flex: 1; min-width: 120px; padding: 12px; }
  .stamp { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: .08em; font-size: 16px; padding: 2px 10px; border-radius: 4px; border: 3px solid currentColor; display: inline-block; transform: rotate(-3deg); }
  .stamp.passed { color: var(--red); } .stamp.failed { color: var(--green); } .stamp.lapsed { color: var(--muted); }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--green-d); color: var(--bg); padding: 12px 18px; border-radius: 8px; max-width: calc(100% - 32px); display: none; z-index: 50; font-weight: 600; box-shadow: 0 6px 0 -2px var(--board); }
  #toast.bad { background: var(--red); color: #fff; }
  @media (max-width: 480px) { .row, .row3 { grid-template-columns: 1fr; } h1 { font-size: 26px; } .stats { grid-template-columns: repeat(2, 1fr); } }


  .cardicon { width: 26px; height: 36px; background: var(--yellow); border-radius: 4px; transform: rotate(-10deg); flex: none; box-shadow: 8px 3px 0 -1px var(--red); margin-right: 6px; }
  header h1 { flex: 1 1 200px; min-width: 0; color: var(--bg); overflow-wrap: normal; }
  @media (max-width: 480px) { header h1 { font-size: 24px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="cardicon" aria-hidden="true"></div>
    <h1>Richmond Royal's Fines Ladder</h1>
    <div class="who" id="who"></div>
  </div>
</header>
<div class="stripes" aria-hidden="true"></div>

<div class="wrap">
  <section id="signin" hidden>
    <h2>Who are you?</h2>
    <form class="panel pad" id="signinForm">
      <div class="row">
        <div class="field"><label for="siName">Your name</label><select id="siName" required></select></div>
        <div class="field"><label for="siPin" id="siPinLabel">4-digit PIN</label><input id="siPin" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" required></div>
      </div>
      <p class="meta" id="siHint" style="margin:0 0 12px"></p>
      <button type="submit">Sign in</button>
    </form>
  </section>

  <section>
    <h2>The ladder <small>approved fines only</small></h2>
    <div class="panel" id="ladder"><div class="empty">Loading…</div></div>
  </section>

  <section>
    <h2>Up for a vote <small id="openCount"></small></h2>
    <div class="panel" id="open"><div class="empty">Loading…</div></div>
  </section>

  <section>
    <h2>Best on ground <small>3-2-1 votes, results stay secret</small></h2>
    <div class="panel" id="bog"><div class="empty">Loading…</div></div>
  </section>

  <section>
    <h2>Write a fine</h2>
    <form class="panel pad" id="fineForm">
      <div class="row">
        <div class="field"><label for="fTarget">Who's being fined</label><select id="fTarget" required></select></div>
        <div class="field"><label for="fAmount">Amount ($)</label><input id="fAmount" type="number" inputmode="decimal" min="0.5" step="0.5" placeholder="5" required></div>
      </div>
      <div class="field"><label for="fReason">What did they do?</label><textarea id="fReason" maxlength="200" placeholder="Turned up late to warm-up" required></textarea></div>
      <button type="submit">Put it to a vote</button>
      <span class="meta" id="fineNote" style="margin-left:10px"></span>
    </form>
  </section>

  <section>
    <h2>Decided</h2>
    <div class="panel" id="history"><div class="empty">Loading…</div></div>
  </section>

  <section id="adminSec" hidden>
    <h2>Admin</h2>
    <div class="panel pad" id="adminBody"></div>
  </section>
</div>
<div id="toast" role="status"></div>

<script>
const API = '/api/fines';
const $ = (id) => document.getElementById(id);
const money = (n) => new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', minimumFractionDigits: n % 1 ? 2 : 0 }).format(n);

function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val);
  } catch (e) { return null; }
}

let state = null;
// me is { id, pin } for a player, or { admin: true, pin } for the admin.
let me = null; try { me = JSON.parse(store('fines_me') || 'null'); } catch (e) {}
if (me && !me.admin && !me.id && me.name) me.id = me.name;   // sign-ins saved by the first version
let myBog = null, adminBog = null, bogSig = '', adminSig = '';

const isAdmin = () => !!(me && me.admin);
const isPlayer = () => !!(me && !me.admin);
const active = () => state.players.filter((p) => !p.removed);
const nameOf = (id) => { const p = state.players.find((x) => x.id === id); return p ? p.name : 'Former player'; };

// Tiny DOM builder: text is always inserted as text, never as HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

let toastTimer;
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), 4000);
}

async function load() {
  try {
    const r = await fetch(API, { cache: 'no-store' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    state = data; render();
  } catch (e) {
    if (!state) for (const id of ['ladder', 'open', 'history', 'bog']) $(id).replaceChildren(h('div', { class: 'empty' }, "Can't reach the fines database. " + (e.message || '')));
  }
}

async function post(action, body) {
  const r = await fetch(API, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, player: isPlayer() ? me.id : '', pin: isPlayer() ? me.pin : '', adminPin: isAdmin() ? me.pin : '', ...body }),
  });
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || 'Something went wrong.');
  if (data.myBog) myBog = data.myBog;
  if (data.bog) adminBog = data.bog;
  if (data.state) { state = data.state; render(); }
  return data;
}

async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, true); }
  if (btn) btn.disabled = false;
}
const act = (action, body, msg) => (e) => run(e.currentTarget, async () => { await post(action, body); if (msg) toast(msg); });

function openFor(since) {
  const hrs = Math.floor((Date.now() - since) / 3600000);
  return hrs < 1 ? 'just opened' : hrs < 48 ? 'open ' + hrs + 'h' : 'open ' + Math.floor(hrs / 24) + ' days';
}
const lineupIds = (r) => r.playing || active().map((p) => p.id);
const dateStr = (ts) => new Date(ts).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });

function pips(count, need) {
  return h('span', { class: 'pips', 'aria-hidden': 'true' }, Array.from({ length: need }, (_, i) => h('span', { class: 'pip' + (i < count ? ' on' : '') })));
}

function fineCard(f) {
  const need = f.need;
  const yes = Object.keys(f.votes).filter((p) => f.votes[p] === 'yes').map(nameOf);
  const no = Object.keys(f.votes).filter((p) => f.votes[p] === 'no').map(nameOf);
  const open = f.status === 'open';
  const card = h('div', { class: 'fine' },
    h('div', { class: 'fhead' }, h('span', { class: 't' }, nameOf(f.target)), h('span', { class: 'a' }, money(f.amount))),
    h('div', { class: 'reason' }, f.reason),
    h('div', { class: 'meta' }, 'Fined by ' + nameOf(f.by) + ' · ' + dateStr(f.createdAt) + (open ? ' · ' + openFor(f.createdAt) : '') + (f.closedAt && !open ? ' · voting closed by admin' : '')),
    h('div', { class: 'tally' },
      h('span', { class: 'c-yes' }, 'Agree ' + yes.length + (open ? '/' + need : ''), open && pips(yes.length, need)),
      h('span', { class: 'c-no' }, 'Disagree ' + no.length + (open ? '/' + need : ''), open && pips(no.length, need))),
    h('div', { class: 'voters' }, (yes.length ? 'Agree: ' + yes.join(', ') : '') + (yes.length && no.length ? ' · ' : '') + (no.length ? 'Disagree: ' + no.join(', ') : ''))
  );
  const actions = h('div', { class: 'actions' });
  if (open) {
    if (!me) actions.append(h('span', { class: 'meta' }, 'Sign in to vote.'));
    else if (isAdmin()) actions.append(h('span', { class: 'meta' }, 'Voting is open.'));
    else if (f.target === me.id) actions.append(h('span', { class: 'meta' }, "This one's yours, so you sit this vote out."));
    else if (f.votes[me.id]) actions.append(h('span', { class: 'meta' }, 'You voted ' + (f.votes[me.id] === 'yes' ? 'agree' : 'disagree') + '.'));
    else actions.append(
      h('button', { class: 'yes', onclick: act('vote', { id: f.id, vote: 'yes' }) }, 'Agree'),
      h('button', { class: 'no', onclick: act('vote', { id: f.id, vote: 'no' }) }, 'Disagree'));
  } else {
    const label = { passed: 'Fined', failed: 'Let off', lapsed: 'Lapsed' }[f.status];
    actions.append(h('span', { class: 'stamp ' + f.status }, label));
  }
  if (isAdmin() && open) actions.append(h('button', { class: 'ghost', onclick: (e) => {
    const outcome = yes.length > no.length ? 'FINED' : 'LET OFF';
    if (confirm('Close voting on this fine now?\n\nIt\'s decided on the votes so far (' + yes.length + ' agree, ' + no.length + ' disagree), so ' + nameOf(f.target) + ' will be ' + outcome + '.')) act('admin_close_fine', { id: f.id }, 'Voting closed: ' + outcome.toLowerCase() + '.')(e);
  } }, 'Close voting'));
  if (isAdmin()) actions.append(
    h('button', { class: 'ghost', onclick: (e) => {
      const v = prompt('New amount in dollars for this fine:', String(f.amount));
      if (v !== null && v.trim() !== '') act('admin_edit_fine', { id: f.id, amount: v.replace('$', '').trim() }, 'Amount updated.')(e);
    } }, 'Change amount'),
    h('button', { class: 'danger', onclick: (e) => { if (confirm('Delete this fine for good?')) act('admin_delete', { id: f.id }, 'Fine deleted.')(e); } }, 'Delete'));
  card.append(actions);
  return card;
}

// Rebuilds a dropdown only when its options change, keeping the current choice.
function fillSelect(sel, options, placeholder) {
  const sig = JSON.stringify(options);
  if (sel.dataset.sig === sig) return;
  sel.dataset.sig = sig;
  const prev = sel.value;
  sel.replaceChildren(h('option', { value: '' }, placeholder), ...options.map(([v, label]) => h('option', { value: v }, label)));
  if (options.some(([v]) => v === prev)) sel.value = prev;
}

function render() {
  if (!state) return;
  const players = active();
  if (isPlayer() && !players.some((p) => p.id === me.id)) { me = null; myBog = null; store('fines_me', null); }
  const opts = players.map((p) => [p.id, p.name]);

  // Header + sign-in
  $('who').replaceChildren(...(me ? [h('span', {}, 'Signed in as ', h('b', {}, isAdmin() ? 'Admin' : nameOf(me.id))), h('button', { class: 'ghost', onclick: signOut }, 'Switch')] : []));
  $('signin').hidden = !!me;
  fillSelect($('siName'), [...opts, ['~admin', 'Admin']], 'Pick your name');
  fillSelect($('fTarget'), opts, 'Pick a player');
  updateHint();
  $('fineNote').textContent = isPlayer() ? 'Voting stays open until the team decides, or the admin closes it.' : isAdmin() ? 'Sign in as a player to write a fine.' : 'Sign in first.';

  // Ladder
  const rows = players.map((p) => ({ id: p.id, name: p.name, total: 0, count: 0, pending: 0 }));
  const by = Object.fromEntries(rows.map((r) => [r.id, r]));
  for (const f of state.fines) {
    if (!by[f.target]) continue;
    if (f.status === 'passed') { by[f.target].total += f.amount; by[f.target].count++; }
    if (f.status === 'open') by[f.target].pending += f.amount;
  }
  rows.sort((a, b) => b.total - a.total || b.count - a.count || a.name.localeCompare(b.name));
  const pot = rows.reduce((s, r) => s + r.total, 0), max = (rows[0] && rows[0].total) || 1;
  let pos = 0, last = null;
  $('ladder').replaceChildren(
    h('div', { class: 'pot' }, h('span', {}, 'Team pot'), h('strong', {}, money(pot))),
    ...rows.map((r, i) => {
      if (r.total !== last) { pos = i + 1; last = r.total; }
      return h('div', { class: 'rung' + (pos === 1 && r.total > 0 ? ' top' : '') + (r.total === 0 ? ' zero' : '') },
        h('div', { class: 'bar', style: 'width:' + (r.total / max) * 100 + '%' }),
        h('div', { class: 'pos' }, r.total > 0 ? String(pos) : '–'),
        h('div', {}, h('div', { class: 'pname' }, r.name),
          h('div', { class: 'pmeta' }, (r.count === 1 ? '1 fine' : r.count + ' fines') + (r.pending ? ' · ' + money(r.pending) + ' pending' : ''))),
        h('div', { class: 'ptotal' }, money(r.total)));
    }));

  // Open + decided
  const openFines = state.fines.filter((f) => f.status === 'open');
  const done = state.fines.filter((f) => f.status !== 'open');
  const mine = isPlayer() ? openFines.filter((f) => f.target !== me.id && !f.votes[me.id]).length : 0;
  $('openCount').textContent = openFines.length ? openFines.length + ' open' + (mine ? ' · ' + mine + ' waiting on you' : '') : '';
  $('open').replaceChildren(...(openFines.length ? openFines.map(fineCard) : [h('div', { class: 'empty' }, 'Nothing to vote on. Everyone is behaving, apparently.')]));
  $('history').replaceChildren(...(done.length ? done.map(fineCard) : [h('div', { class: 'empty' }, 'No fines decided yet.')]));

  renderBog(players);
  renderAdmin();
}

function updateHint() {
  const v = $('siName').value, admin = v === '~admin', pin = $('siPin');
  $('siPinLabel').textContent = admin ? 'Admin code' : '4-digit PIN';
  if (admin) { pin.removeAttribute('pattern'); pin.removeAttribute('maxlength'); pin.setAttribute('inputmode', 'text'); }
  else { pin.setAttribute('pattern', '\\d{4}'); pin.setAttribute('maxlength', '4'); pin.setAttribute('inputmode', 'numeric'); }
  const p = state && state.players.find((x) => x.id === v);
  $('siHint').textContent = admin ? 'Enter the admin code.' : !p ? '' : p.hasPin ? 'Enter the PIN you set earlier. Forgotten it? Ask the admin to reset it.' : 'First time: the PIN you enter now becomes your PIN. Remember it.';
}
$('siName').addEventListener('change', updateHint);

function signOut() { me = null; myBog = null; adminBog = null; store('fines_me', null); render(); }

$('signinForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const v = $('siName').value, pin = $('siPin').value;
  run(ev.submitter, async () => {
    me = v === '~admin' ? { admin: true, pin } : { id: v, pin };
    try {
      const d = await post(me.admin ? 'admin_check' : 'login', {});
      store('fines_me', JSON.stringify(me)); $('siPin').value = '';
      toast(me.admin ? 'Signed in as Admin.' : d.created ? 'PIN set. Welcome, ' + nameOf(v) + '.' : 'Signed in as ' + nameOf(v) + '.');
      render();
    } catch (e) { me = null; throw e; }
  });
});

$('fineForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  if (!isPlayer()) { toast(isAdmin() ? 'Sign in as a player to write a fine.' : 'Sign in first.', true); return; }
  run(ev.submitter, async () => {
    await post('create', { target: $('fTarget').value, amount: $('fAmount').value, reason: $('fReason').value });
    ev.target.reset(); toast('Fine is up for a vote.');
  });
});

// ---- Best on ground ------------------------------------------------------
function renderBog(players) {
  const rounds = (state.bogRounds || []).filter((r) => r.open);
  const sig = JSON.stringify([rounds, me && (me.id || 'admin'), myBog, players]);
  if (sig === bogSig) return;   // don't wipe half-filled votes on the 20s refresh
  bogSig = sig;
  if (!rounds.length) { $('bog').replaceChildren(h('div', { class: 'empty' }, 'No game is open for votes right now.')); return; }
  $('bog').replaceChildren(...rounds.map((r) => {
    const card = h('div', { class: 'fine' }, h('div', { class: 'fhead' }, h('span', { class: 't' }, r.name)));
    if (!me) card.append(h('div', { class: 'meta' }, 'Sign in to vote.'));
    else if (isAdmin()) card.append(h('div', { class: 'meta' }, 'Voting is open. Sign in as a player to vote.'));
    else if ((myBog || []).includes(r.id)) card.append(h('div', { class: 'meta' }, "Your votes are in. They can't be changed."));
    else if (!lineupIds(r).includes(me.id)) card.append(h('div', { class: 'meta' }, "You weren't in the lineup for this game, so you don't vote in it."));
    else {
      const others = players.filter((p) => lineupIds(r).includes(p.id));   // everyone who played, yourself included
      const pick = (label) => h('select', { 'aria-label': label, required: '' }, h('option', { value: '' }, 'Pick a player'), ...others.map((p) => h('option', { value: p.id }, p.name)));
      const sels = [pick('3 votes'), pick('2 votes'), pick('1 vote')];
      card.append(h('form', { style: 'margin-top:10px', onsubmit: (ev) => {
        ev.preventDefault();
        const picks = sels.map((x) => x.value);
        if (new Set(picks).size !== 3) { toast('Pick three different players.', true); return; }
        run(ev.submitter, async () => { await post('bog_vote', { id: r.id, picks }); toast('Votes submitted.'); });
      } },
        h('div', { class: 'row3' }, ...sels.map((x, i) => h('div', { class: 'field' }, h('label', {}, ['3 votes', '2 votes', '1 vote'][i]), x))),
        h('button', { type: 'submit' }, 'Submit votes'),
        h('span', { class: 'meta', style: 'margin-left:10px' }, "Can't be changed once submitted.")));
    }
    return card;
  }));
}

// Tick boxes for who played; returns the element and a way to read the ticks.
function lineupPicker(selected) {
  const set = new Set(selected);
  const boxes = active().map((p) => {
    const cb = h('input', { type: 'checkbox', value: p.id });
    cb.checked = set.has(p.id);
    return { cb, el: h('label', { class: 'tick' }, cb, p.name) };
  });
  return { el: h('div', { class: 'ticks' }, ...boxes.map((b) => b.el)), value: () => boxes.filter((b) => b.cb.checked).map((b) => b.cb.value) };
}

// ---- Admin screen (only shown when signed in as Admin) --------------------
function renderAdmin() {
  $('adminSec').hidden = !isAdmin();
  if (!isAdmin()) { adminSig = ''; return; }
  const sig = JSON.stringify([state.players, adminBog, state.bogRounds]);
  if (sig === adminSig) return;   // don't wipe names being typed on the 20s refresh
  adminSig = sig;
  const body = $('adminBody');

  const playerRows = state.players.map((p) => {
    if (p.removed) return h('div', { class: 'prow' }, h('span', { class: 'meta', style: 'flex:1' }, p.name + ' (removed)'),
      h('button', { class: 'ghost', onclick: act('admin_player_remove', { player: p.id }, p.name + ' is back in the team.') }, 'Restore'));
    const input = h('input', { value: p.name, maxlength: '30', 'aria-label': 'Name for ' + p.name });
    return h('div', { class: 'prow' }, input,
      h('button', { class: 'ghost', onclick: (e) => act('admin_player_rename', { player: p.id, playerName: input.value }, 'Name saved.')(e) }, 'Save name'),
      h('button', { class: 'ghost', onclick: act('admin_reset_pin', { player: p.id }, p.name + "'s PIN was reset.") }, 'Reset PIN'),
      h('button', { class: 'danger', onclick: (e) => { if (confirm('Remove ' + p.name + ' from the team? Their past fines and votes are kept, and you can restore them later.')) act('admin_player_remove', { player: p.id }, p.name + ' removed.')(e); } }, 'Remove'));
  });
  const addInput = h('input', { placeholder: 'New player name', maxlength: '30', 'aria-label': 'New player name', required: '' });
  const gameInput = h('input', { placeholder: 'Round 5 v Tigers', maxlength: '60', 'aria-label': 'Game name', required: '' });
  const bog = adminBog || { rounds: [], leaderboard: [] };
  const lastRound = (state.bogRounds || [])[0];
  const newLineup = lineupPicker(lastRound ? lineupIds(lastRound) : active().map((p) => p.id));
  const link = location.origin + '/';
  const linkInput = h('input', { value: link, readonly: '', 'aria-label': 'Team link' });
  const codeInput = h('input', { type: 'password', placeholder: 'New admin code (6+ characters)', minlength: '6', autocomplete: 'new-password', 'aria-label': 'New admin code', required: '' });
  let pos = 0, last = null;

  body.replaceChildren(
    h('div', { class: 'sub', style: 'margin-top:0' }, 'Share with the team'),
    h('div', { class: 'prow' }, linkInput,
      h('button', { onclick: async () => { try { await navigator.clipboard.writeText(link); toast('Link copied.'); } catch (e) { linkInput.select(); toast('Select the link and copy it.'); } } }, 'Copy link')),
    h('p', { class: 'meta', style: 'margin:0' }, 'Each player picks their name and sets a PIN the first time.'),

    h('div', { class: 'sub' }, 'Players'),
    ...playerRows,
    h('form', { class: 'prow', onsubmit: (ev) => { ev.preventDefault(); run(ev.submitter, async () => { await post('admin_player_add', { playerName: addInput.value }); toast('Player added.'); }); } },
      addInput, h('button', { type: 'submit' }, 'Add player')),

    h('div', { class: 'sub' }, 'Fines'),
    h('p', { class: 'meta', style: 'margin:0' }, 'Every fine in the lists above has Change amount and Delete buttons. Open fines also have Close voting, which decides the fine on the votes cast so far.'),

    h('div', { class: 'sub' }, 'Best on ground'),
    h('form', { onsubmit: (ev) => { ev.preventDefault(); run(ev.submitter, async () => { await post('admin_bog_open', { roundName: gameInput.value, playing: newLineup.value() }); toast('Voting is open.'); }); } },
      h('div', { class: 'prow' }, gameInput),
      h('p', { class: 'meta', style: 'margin:4px 0 8px' }, lastRound ? 'Who played? Copied from ' + lastRound.name + ', so just change who was in or out.' : 'Who played? Untick anyone who missed the game.'),
      newLineup.el,
      h('button', { type: 'submit', style: 'margin-top:10px' }, 'Open voting')),
    h('div', { class: 'sub' }, 'Season MVP leaderboard ', h('button', { class: 'ghost', onclick: act('admin_bog', {}, 'Refreshed.') }, 'Refresh')),
    h('p', { class: 'meta', style: 'margin:0 0 6px' }, 'Only the admin can see this.'),
    ...bog.leaderboard.map((p, i) => {
      if (p.points !== last) { pos = i + 1; last = p.points; }
      return h('div', { class: 'mvp' }, h('span', { class: 'meta' }, p.points ? String(pos) : '–'), h('span', {}, p.name),
        h('span', { class: 'meta' }, p.threes + '×3  ' + p.twos + '×2  ' + p.ones + '×1'), h('b', {}, String(p.points)));
    }),
    h('div', { class: 'sub' }, 'Game by game'),
    ...(bog.rounds.length ? bog.rounds.map((r) => h('div', { class: 'rnd' },
      h('div', {}, h('b', {}, r.name), ' · ' + (r.open ? 'open' : 'closed') + ' · ' + r.voted.length + ' of ' + (r.voted.length + r.missing.length) + ' voted'),
      ...(r.result.length ? r.result.map((p, i) => h('div', { class: 'mvp' }, h('span', { class: 'meta' }, String(r.result.findIndex((x) => x.points === p.points) + 1)), h('span', {}, p.name + (p.points === r.result[0].points ? ' · best on ground' : '')), h('span', {}), h('b', {}, String(p.points))))
        : [h('div', { class: 'meta' }, 'No votes in yet.')]),
      h('div', { class: 'meta', style: 'margin-top:6px' }, 'Voted: ' + (r.voted.join(', ') || 'nobody yet')),
      h('div', { class: 'meta' }, 'Still to vote: ' + (r.missing.join(', ') || 'nobody')),
      (() => {
        const lp = lineupPicker(lineupIds(r));
        return h('details', { style: 'margin-top:6px' }, h('summary', { class: 'meta', style: 'cursor:pointer' }, 'Edit who played'),
          h('div', { style: 'margin-top:8px' }, lp.el),
          h('button', { class: 'ghost', style: 'margin-top:8px', onclick: (e) => act('admin_bog_lineup', { id: r.id, playing: lp.value() }, 'Lineup saved.')(e) }, 'Save lineup'));
      })(),
      h('div', { class: 'actions' },
        h('button', { class: 'ghost', onclick: act('admin_bog_toggle', { id: r.id }) }, r.open ? 'Close voting' : 'Reopen voting'),
        h('button', { class: 'danger', onclick: (e) => { if (confirm('Delete this game and its votes for good?')) act('admin_bog_delete', { id: r.id })(e); } }, 'Delete')))) : [h('p', { class: 'meta' }, 'No games yet.')]),

    h('div', { class: 'sub' }, 'Admin code'),
    h('form', { class: 'prow', onsubmit: (ev) => { ev.preventDefault(); run(ev.submitter, async () => {
      const code = codeInput.value;
      await post('admin_change_code', { newCode: code });
      me.pin = code; store('fines_me', JSON.stringify(me)); codeInput.value = ''; toast('Admin code changed.');
    }); } }, codeInput, h('button', { type: 'submit' }, 'Change code')),
    h('p', { class: 'meta', style: 'margin:0' }, 'The old code stops working straight away. Keep the new one somewhere safe.'),

    h('div', { class: 'sub' }, 'New season'),
    h('button', { class: 'danger', onclick: (e) => { if (confirm('Wipe every fine, vote and best on ground result and start a new season? Players and PINs are kept. This cannot be undone.')) act('admin_reset_season', {}, 'New season. Ladder cleared.')(e); } }, 'Reset season'));
}

load().then(() => {
  if (isPlayer()) post('bog_mine', {}).catch(() => {});
  if (isAdmin()) post('admin_bog', {}).catch((e) => { toast(e.message, true); signOut(); });
});
setInterval(load, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
